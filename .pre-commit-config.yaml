repos:
  # --- General file hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # accounting-v1.yaml / inventory-v1.json are generated OpenAPI
        # contract deliverables (Epic 5/8), legitimately >500KB.
        exclude: ^specs/(005-inventory-management|008-accounting-finance)/contracts/(inventory-v1\.json|accounting-v1\.yaml)$

  # --- Python formatting ---
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        files: ^backend/

  # --- Python linting ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/

  # --- Python type checking (run via CI, not pre-commit) ---
  # mypy removed from pre-commit: too slow for commit-time checks.
  # Run manually: cd backend && python -m mypy .
