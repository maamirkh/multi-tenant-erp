# Profile & Preferences API Contract — Epic 4 Users & Roles
# OpenAPI 3.1 Fragment

paths:
  /api/v1/profile:
    get:
      operationId: getProfile
      summary: Get current user's profile
      tags: [Profile]
      responses:
        200:
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        401: { $ref: '#/components/responses/Unauthorized' }

    patch:
      operationId: updateProfile
      summary: Update current user's profile
      tags: [Profile]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        200:
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        400: { description: Validation error }

  /api/v1/profile/avatar:
    post:
      operationId: uploadAvatar
      summary: Upload user avatar
      tags: [Profile]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, WebP; max 5MB)
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url: { type: string }
        400: { description: Invalid file type or size exceeded }
        413: { description: File too large }

    delete:
      operationId: deleteAvatar
      summary: Remove current avatar
      tags: [Profile]
      responses:
        204: { description: Avatar removed }

  /api/v1/preferences:
    get:
      operationId: getPreferences
      summary: Get current user's preferences
      tags: [Preferences]
      responses:
        200:
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceResponse' }

    put:
      operationId: updatePreferences
      summary: Update user preferences
      tags: [Preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePreferenceRequest' }
      responses:
        200:
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenceResponse' }
        400: { description: Invalid timezone, language, or format }

components:
  schemas:
    ProfileResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        phone: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpdateProfileRequest:
      type: object
      properties:
        display_name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 20, nullable: true }

    PreferenceResponse:
      type: object
      properties:
        language: { type: string }
        timezone: { type: string }
        date_format: { type: string }
        number_format: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        notification_preferences: { type: object }

    UpdatePreferenceRequest:
      type: object
      properties:
        language: { type: string, minLength: 2, maxLength: 10 }
        timezone: { type: string, maxLength: 50 }
        date_format: { type: string, enum: ['YYYY-MM-DD', 'DD/MM/YYYY', 'MM/DD/YYYY', 'DD-MM-YYYY'] }
        number_format: { type: string, maxLength: 20 }
        theme: { type: string, enum: [light, dark, system] }
