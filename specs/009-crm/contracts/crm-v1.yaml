components:
  schemas:
    ActivityCreate:
      properties:
        activity_type:
          type: string
          title: Activity Type
        subject:
          type: string
          maxLength: 300
          minLength: 1
          title: Subject
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        priority:
          type: string
          title: Priority
          default: MEDIUM
        due_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Due Date
        assigned_to:
          type: string
          format: uuid
          title: Assigned To
        lead_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Lead Id
        customer_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Customer Id
        opportunity_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Opportunity Id
      type: object
      required:
      - activity_type
      - subject
      - assigned_to
      title: ActivityCreate
      description: Request body for logging a new Activity (spec.md §19.1).
    ActivityRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        company_id:
          type: string
          format: uuid
          title: Company Id
        activity_type:
          type: string
          title: Activity Type
        subject:
          type: string
          title: Subject
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        status:
          type: string
          title: Status
        priority:
          type: string
          title: Priority
        due_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Due Date
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        assigned_to:
          type: string
          format: uuid
          title: Assigned To
        lead_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Lead Id
        customer_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Customer Id
        opportunity_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Opportunity Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - company_id
      - activity_type
      - subject
      - description
      - status
      - priority
      - due_date
      - completed_at
      - assigned_to
      - lead_id
      - customer_id
      - opportunity_id
      - created_at
      - updated_at
      title: ActivityRead
      description: Response body for an Activity.
    ActivityReport:
      properties:
        completed_count:
          type: integer
          title: Completed Count
        completed_by_type:
          additionalProperties:
            type: integer
          type: object
          title: Completed By Type
        overdue_count:
          type: integer
          title: Overdue Count
        overdue_by_owner:
          additionalProperties:
            type: integer
          type: object
          title: Overdue By Owner
        date_from:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
        date_to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      type: object
      required:
      - completed_count
      - completed_by_type
      - overdue_count
      - overdue_by_owner
      - date_from
      - date_to
      title: ActivityReport
      description: spec.md §40.3.
    ActivityUpdate:
      properties:
        subject:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 1
          - type: 'null'
          title: Subject
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        priority:
          anyOf:
          - type: string
          - type: 'null'
          title: Priority
        due_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Due Date
        assigned_to:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Assigned To
      type: object
      title: ActivityUpdate
      description: Request body for updating an Activity. All fields optional.
    ConversionResult:
      properties:
        lead_id:
          type: string
          format: uuid
          title: Lead Id
        customer_id:
          type: string
          format: uuid
          title: Customer Id
        opportunity_id:
          type: string
          format: uuid
          title: Opportunity Id
        customer_matched:
          type: boolean
          title: Customer Matched
      type: object
      required:
      - lead_id
      - customer_id
      - opportunity_id
      - customer_matched
      title: ConversionResult
      description: Response body for POST /crm/leads/{id}/convert (spec.md §16, §38.1).
    CrmDashboard:
      properties:
        open_pipeline_value:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Open Pipeline Value
        weighted_pipeline_value:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Weighted Pipeline Value
        lead_count:
          type: integer
          title: Lead Count
        conversion_rate:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Conversion Rate
        win_rate:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Win Rate
        overdue_follow_up_count:
          type: integer
          title: Overdue Follow Up Count
        activities_completed:
          type: integer
          title: Activities Completed
        period_from:
          type: string
          format: date
          title: Period From
        period_to:
          type: string
          format: date
          title: Period To
      type: object
      required:
      - open_pipeline_value
      - weighted_pipeline_value
      - lead_count
      - conversion_rate
      - win_rate
      - overdue_follow_up_count
      - activities_completed
      - period_from
      - period_to
      title: CrmDashboard
      description: 'spec.md §41 — the single-call dashboard KPI set, for the current

        calendar month unless the module is later extended with an explicit

        period parameter.'
    Customer360:
      properties:
        customer:
          $ref: '#/components/schemas/CustomerSummary'
        converted_leads:
          items:
            $ref: '#/components/schemas/LeadRead'
          type: array
          title: Converted Leads
        opportunities:
          items:
            $ref: '#/components/schemas/OpportunityRead'
          type: array
          title: Opportunities
        activities:
          items:
            $ref: '#/components/schemas/ActivityRead'
          type: array
          title: Activities
        sales_history:
          $ref: '#/components/schemas/SalesHistorySummary'
        financial_summary:
          $ref: '#/components/schemas/FinancialSummary'
        last_interaction:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Interaction
        next_follow_up:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Next Follow Up
      type: object
      required:
      - customer
      - converted_leads
      - opportunities
      - activities
      - sales_history
      - financial_summary
      - last_interaction
      - next_follow_up
      title: Customer360
      description: Response body for ``GET /crm/customers/{customer_id}/360``.
    CustomerSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        customer_code:
          type: string
          title: Customer Code
        legal_name:
          type: string
          title: Legal Name
        trading_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Trading Name
        status:
          type: string
          title: Status
        currency_code:
          type: string
          title: Currency Code
      type: object
      required:
      - id
      - customer_code
      - legal_name
      - trading_name
      - status
      - currency_code
      title: CustomerSummary
      description: 'Core Customer identity fields, read live from Sales'' ``Customer`` —

        never duplicated/persisted CRM-side (§20.1).'
    FinancialSummary:
      properties:
        total_outstanding_base:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Total Outstanding Base
        credit_limit:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Credit Limit
        credit_status:
          type: string
          title: Credit Status
        as_of_date:
          type: string
          format: date
          title: As Of Date
        current:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Current
        days_1_30:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Days 1 30
        days_31_60:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Days 31 60
        days_61_90:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Days 61 90
        days_91_120:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Days 91 120
        days_120_plus:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Days 120 Plus
      type: object
      required:
      - total_outstanding_base
      - credit_limit
      - credit_status
      - as_of_date
      - current
      - days_1_30
      - days_31_60
      - days_61_90
      - days_91_120
      - days_120_plus
      title: FinancialSummary
      description: 'Live Accounts Receivable figures — always fetched fresh from

        ``AccountsReceivableService`` on every request, never cached (§20.2,

        AC-16). A Customer with no AR activity yet (no ``CustomerLedger`` row)

        degrades to all-zero/``GOOD`` values rather than a 404 (AC-17).'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LeadAssignRequest:
      properties:
        owner_id:
          type: string
          format: uuid
          title: Owner Id
      type: object
      required:
      - owner_id
      title: LeadAssignRequest
      description: Request body for POST /crm/leads/{id}/assign.
    LeadCreate:
      properties:
        first_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Last Name
        lead_company_name:
