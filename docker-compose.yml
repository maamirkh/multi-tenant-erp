# =============================================================================
# DevSphere ERP — Docker Compose (local development)
#
# Usage:
#   cp .env.example .env        # fill in values once
#   docker compose up --build   # start all services
#   docker compose down         # stop (data persists in postgres_data volume)
#   docker compose down -v      # stop and wipe all data
#
# Services:
#   db   — PostgreSQL 16 (port 5432)
#   api  — FastAPI backend with hot reload (port 8000)
#   web  — Next.js frontend with hot reload (port 3000)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # db — PostgreSQL 16
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # api — FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_VERSION: ${API_VERSION:-1.0.0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      # Authentication (Epic 002) — required at startup
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_REMEMBER_ME_EXPIRE_DAYS: ${JWT_REMEMBER_ME_EXPIRE_DAYS:-30}
      JWT_ISSUER: ${JWT_ISSUER:-devsphere-erp}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-devsphere-erp-api}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:-30}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
      AUTH_LOCKOUT_WINDOW_MINUTES: ${AUTH_LOCKOUT_WINDOW_MINUTES:-15}
      AUTH_LOCKOUT_DURATION_MINUTES: ${AUTH_LOCKOUT_DURATION_MINUTES:-30}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-90}
      # Storage — S3/MinIO (Epic 003)
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-devsphere-companies}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Companies — Business Rules (Epic 003)
      COMPANY_LIMIT: ${COMPANY_LIMIT:-10}
      COMPANY_LOGO_MAX_BYTES: ${COMPANY_LOGO_MAX_BYTES:-2097152}
      COMPANY_DELETION_RETENTION_DAYS: ${COMPANY_DELETION_RETENTION_DAYS:-30}
      LOGO_RETENTION_DAYS: ${LOGO_RETENTION_DAYS:-7}
    volumes:
      # Mount source for hot reload; .dockerignore prevents .env from copying
      - ./backend:/app
      # Preserve the virtual environment installed during image build
      - /app/.venv
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # web — Next.js frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-DevSphere ERP}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
    volumes:
      # Mount source for hot reload
      - ./frontend:/app
      # Preserve node_modules installed during image build
      - /app/node_modules
      # Preserve Next.js build cache
      - /app/.next
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]

  # ---------------------------------------------------------------------------
  # minio — S3-compatible object storage (local development)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  # Persists PostgreSQL data across docker compose down / up cycles.
  # Use `docker compose down -v` to wipe all data.
  postgres_data:
  # Persists MinIO object storage data across docker compose down / up cycles.
  minio_data:
