# =============================================================================
# Alembic configuration for DevSphere ERP backend
#
# Run migrations from the backend/ directory:
#   alembic upgrade head
#   alembic downgrade base
#   alembic revision --autogenerate -m "description"
# =============================================================================

[alembic]
# Path to the migration scripts directory (relative to this file).
script_location = migrations

# Migration file naming: YYYYMMDD_<rev>_<slug>.py
# e.g. 20260711_001_initial_baseline.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# The database URL is NOT set here — it is injected by migrations/env.py
# from the DATABASE_URL environment variable (or .env file).
# Leaving this value here as documentation only; env.py overrides it.
sqlalchemy.url =

# Prepend the backend/ directory to sys.path so that
#   from core.database.base import Base
# works inside migrations/env.py when alembic is invoked from backend/.
prepend_sys_path = .

# Output encoding for generated migration files.
output_encoding = utf-8

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
