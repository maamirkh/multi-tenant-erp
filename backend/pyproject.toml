[tool.poetry]
name = "devsphere-erp-backend"
version = "0.1.0"
description = "DevSphere ERP — Backend API (Foundation Platform)"
authors = ["DevSphere Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { version = "*", extras = ["standard"] }
pydantic = { version = "*", extras = ["email"] }
pydantic-settings = "*"
sqlalchemy = "*"
alembic = "*"
psycopg2-binary = "*"
uvicorn = { version = "*", extras = ["standard"] }
python-dotenv = "*"
argon2-cffi = ">=23.1"
pyjwt = { version = ">=2.8", extras = ["crypto"] }
slowapi = ">=0.1.9"
boto3 = ">=1.26"
openpyxl = ">=3.1"
tzdata = ">=2024.1"
apscheduler = ">=3.10"
reportlab = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
httpx = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # Exception class names use the 'Exception' suffix as prescribed by the
    # approved spec (ApplicationException, NotFoundException, etc.).
    # Renaming them to 'Error' suffix would break the approved API contract.
    "N818",
    # Pydantic generic models require 'class Foo(BaseModel, Generic[T])'.
    # PEP 695 type parameter syntax ('class Foo[T](BaseModel)') is not yet
    # reliably supported by Pydantic v2 + mypy across all use cases.
    "UP040",
    # Line length is enforced by Black; E501 false-positives on long Field()
    # descriptions in settings.py and long docstrings/URL strings that cannot
    # be shortened without reducing readability.
    "E501",
    # StrEnum (UP042) requires Python 3.11+ stdlib; using str+Enum for
    # broader compatibility and explicit Pydantic v2 serialisation control.
    "UP042",
    # N806: Allow UPPER_CASE local variables for constants-in-function patterns.
    "N806",
]

[tool.ruff.lint.per-file-ignores]
# Test files may use late imports and assign-for-side-effect patterns.
"tests/**" = ["F841", "E402", "N801"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# Production code (modules/, core/, api/, migrations/) keeps full strict
# mode. Tests are ~83% of the pre-remediation error backlog (~3900/4700),
# overwhelmingly `no-untyped-def`/`no-untyped-call` from pytest test
# functions/fixtures never annotated with `-> None` — a standard, accepted
# gap (see mypy's own "Using mypy with an existing codebase" guidance) with
# no correctness value: a missing `-> None` on `def test_x(self, db):` never
# indicates a bug. `check_untyped_defs` stays on, so mypy still type-checks
# the *body* of every test function against its (inferred) types — a real
# mismatch like `arg-type`/`attr-defined`/`union-attr` inside a test still
# fails, which is what would actually catch a test calling a service with a
# stale/wrong signature. This is a scoped exemption from one specific
# strict-mode requirement, not `ignore_errors`, and does not touch how any
# production module is checked.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
# `method-assign`: patching a real instance's bound method directly with a
# `MagicMock` (`svc._user_repo.find_by_email = MagicMock(...)`) is the
# standard, ubiquitous test-isolation pattern used throughout this suite —
# mypy's structural objection (a class-level method reassigned per-instance
# could break polymorphism) has no bearing on test doubles, which are never
# subclassed/polymorphic. Disabling it does not weaken the arg-type/
# attr-defined/union-attr coverage described above: a genuinely
# wrong-shaped replacement still fails at its call site with a normal,
# unsuppressed type error, not via method-assign itself.
disable_error_code = ["method-assign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "--tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "migrations/*",
    ".venv/*",
    "*/__init__.py",
    # Auth interfaces are Protocol/stub classes — no executable logic to cover.
    # They will be implemented in the Authentication Epic.
    "core/auth/interfaces.py",
    # Base service is a placeholder — implemented per-module in later Epics.
    "core/services/base.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
