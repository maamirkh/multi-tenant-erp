# =============================================================================
# DevSphere ERP — Frontend CI
#
# Triggers:  push to main/002-auth-identity, PRs targeting main
# Jobs:      lint → test → build (sequential quality gates)
#
# Quality gates (all must pass before merge):
#   - ESLint (zero errors)
#   - TypeScript strict type-check (tsc --noEmit)
#   - Jest (all tests pass, passWithNoTests)
#   - npm audit (zero HIGH/CRITICAL vulnerabilities)
#   - Next.js production build (next build — TypeScript + bundle errors fail CI)
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main, "002-auth-identity"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: "22"
  # Required by Next.js build for API URL reference
  NEXT_PUBLIC_API_URL: "http://localhost:8000"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint (ESLint + TypeScript)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Job 2: Tests
  # ---------------------------------------------------------------------------
  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm run test:ci

  # ---------------------------------------------------------------------------
  # Job 3: Security Audit
  # ---------------------------------------------------------------------------
  security:
    name: npm Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (HIGH+ only)
        # Fail only on HIGH or CRITICAL vulnerabilities.
        # Moderate findings (e.g., postcss bundled in Next.js build toolchain)
        # are documented in specs/002-auth-identity/security-review.md.
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Job 4: Production Build
  # ---------------------------------------------------------------------------
  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: frontend/.next
          retention-days: 3
